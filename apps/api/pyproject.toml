[project]
name = "kimmy"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.15,<2",
    "procrastinate==3.10.0",
    "langchain>=1,<2",
    "langchain-openai>=1,<2",
    "langchain-openrouter>=0.2,<1",
    "langgraph-checkpoint-postgres>=3,<4",
    "httpx>=0.28,<1",
    "openrouter>=0.11,<1",
    "langgraph>=1.2,<2",
    "langchain-core>=1.6,<2",
    "psycopg-pool>=3.2,<4",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[dependency-groups]
dev = ["ruff>=0.11", "mypy>=1.15"]
[tool.ruff]
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
