name: kimmy
x-backend-environment: &backend-environment
  KIMMY_DATABASE_URL: postgresql+psycopg://kimmy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/kimmy
  KIMMY_DEMO_USER_ID: ${KIMMY_DEMO_USER_ID:-demo-user}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  KIMMY_CHAT_PROVIDER: ${KIMMY_CHAT_PROVIDER:-openai}
  KIMMY_OPENAI_CHAT_MODEL: ${KIMMY_OPENAI_CHAT_MODEL:-gpt-6-luna}
  KIMMY_OPENROUTER_CHAT_MODEL: ${KIMMY_OPENROUTER_CHAT_MODEL:-deepseek/deepseek-v4.1-flash-1017}
  KIMMY_OPENAI_EMBEDDING_MODEL: ${KIMMY_OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
  KIMMY_EMBEDDING_DIMENSIONS: ${KIMMY_EMBEDDING_DIMENSIONS:-1536}
  KIMMY_MODEL_TIMEOUT_SECONDS: ${KIMMY_MODEL_TIMEOUT_SECONDS:-60}
  KIMMY_AGENT_TIMEOUT_SECONDS: ${KIMMY_AGENT_TIMEOUT_SECONDS:-180}
  KIMMY_AGENT_MAX_TOOL_CALLS: ${KIMMY_AGENT_MAX_TOOL_CALLS:-8}
  KIMMY_AGENT_MAX_MODEL_CALLS: ${KIMMY_AGENT_MAX_MODEL_CALLS:-10}
  KIMMY_AGENT_MAX_OUTPUT_TOKENS: ${KIMMY_AGENT_MAX_OUTPUT_TOKENS:-4096}
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: kimmy
      POSTGRES_DB: kimmy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command: ["postgres", "-c", "timezone=UTC"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kimmy -d kimmy"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=6)"]
      interval: 10s
      timeout: 8s
      retries: 5
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["/app/.venv/bin/python", "-m", "kimmy.cli", "migrate"]
    environment:
      KIMMY_DATABASE_URL: postgresql+psycopg://kimmy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/kimmy
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["/app/.venv/bin/python", "-m", "kimmy.jobs"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  postgres-data:
