name: kimmy
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: kimmy
      POSTGRES_DB: kimmy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command: ["postgres", "-c", "timezone=UTC"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kimmy -d kimmy"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      KIMMY_DATABASE_URL: postgresql+psycopg://kimmy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/kimmy
      KIMMY_DEMO_USER_ID: ${KIMMY_DEMO_USER_ID:-demo-user}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=6)"]
      interval: 10s
      timeout: 8s
      retries: 5
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  postgres-data:
